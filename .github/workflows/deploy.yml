name: Deploy SpringStalk to Elastic Beanstalk

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: maven

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Set deployment version
        id: version
        run: |
          echo "RUN_NUMBER=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "APP_VERSION=0.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create deployment ZIP (JAR + Procfile)
        run: |
          mkdir -p deploy
          cp target/*.jar deploy/app.jar
          cp Procfile deploy/Procfile
          cd deploy && zip -r ../deploy-${{ steps.version.outputs.RUN_NUMBER }}.zip .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload bundle to S3
        run: |
          aws s3 cp deploy-${{ steps.version.outputs.RUN_NUMBER }}.zip \
            s3://${{ secrets.S3_BUCKET }}/deploy-${{ steps.version.outputs.RUN_NUMBER }}.zip

      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ secrets.EB_APP_NAME }} \
            --version-label ${{ steps.version.outputs.RUN_NUMBER }} \
            --source-bundle S3Bucket=${{ secrets.S3_BUCKET }},S3Key=deploy-${{ steps.version.outputs.RUN_NUMBER }}.zip

      - name: Deploy to Elastic Beanstalk
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name ${{ secrets.EB_ENV_NAME }} \
            --version-label ${{ steps.version.outputs.RUN_NUMBER }} \
            --option-settings Namespace=aws:elasticbeanstalk:application:environment,OptionName=VERSION,Value=${{ steps.version.outputs.APP_VERSION }}

      - name: Wait for deployment to finish
        run: |
          aws elasticbeanstalk wait environment-updated \
            --environment-name ${{ secrets.EB_ENV_NAME }}

      - name: Verify deployment health
        run: |
          STATUS=$(aws elasticbeanstalk describe-environments \
            --environment-names ${{ secrets.EB_ENV_NAME }} \
            --query "Environments[0].Status" --output text)
          HEALTH=$(aws elasticbeanstalk describe-environments \
            --environment-names ${{ secrets.EB_ENV_NAME }} \
            --query "Environments[0].Health" --output text)
          echo "Status=$STATUS Health=$HEALTH"
          if [ "$STATUS" != "Ready" ] || { [ "$HEALTH" != "Green" ] && [ "$HEALTH" != "Yellow" ]; }; then
            echo "Deployment did not reach a healthy state." >&2
            exit 1
          fi
